<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alfresco CAD Viewer</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #111827;
        color: #e5e7eb;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #chrome {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        padding: 0.5rem 0.75rem;
        background: #0f172a;
        border-bottom: 1px solid #1f2937;
      }
      #chrome[hidden] {
        display: none;
      }
      #chrome button,
      #chrome input[type='text'] {
        font: inherit;
        color: inherit;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 4px;
        padding: 0.35rem 0.6rem;
      }
      #chrome input[type='text'] {
        flex: 1 1 16rem;
        min-width: 12rem;
      }
      #chrome button {
        cursor: pointer;
      }
      #chrome button:hover {
        background: #374151;
      }
      #status {
        font-size: 0.8rem;
        color: #9ca3af;
        margin-left: auto;
      }
      #status[data-kind='error'] {
        color: #fca5a5;
      }
      #viewer-pane {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }
      #cad-container {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="chrome">
        <button id="open-file" type="button">Open file</button>
        <input id="file-input" type="file" accept=".dwg,.dxf,application/dxf,image/vnd.dwg" hidden />
        <input id="url-input" type="text" placeholder="https://…/drawing.dwg" />
        <button id="open-url" type="button">Open URL</button>
        <button id="open-sample" type="button">Sample DWG</button>
        <span id="status">Open a DWG or DXF</span>
      </div>
      <div id="viewer-pane">
        <div id="cad-container"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
